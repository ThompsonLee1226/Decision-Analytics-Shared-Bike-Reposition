# Smoke test: same pipeline, restricted to the gathering points only.
#
# 801 cells instead of 9,594, so a full run is seconds rather than minutes.  The
# point is not the score -- it is that `source -> slots -> loss -> fold ->
# bundle -> predict` runs end to end and that the gamma loss reports both halves.
run:
  name: smoke_gp
  outdir: ../runs
  seed: 0
  verbose: true

source:
  kind: orders
  path: ../data/orders_2026.csv.gz
  days: workday
  holidays: [2026-04-04, 2026-04-05, 2026-04-06,
             2026-05-01, 2026-05-02, 2026-05-03, 2026-05-04, 2026-05-05]
  makeup: [2026-05-09]
  cells:
    file: ../data/gathering_points.json
  sort_rows: false

slots:
  start: "07:30"
  span_minutes: 180
  width_minutes: 60

unit:
  level: 8
  shape: [1, 1]
  aligned: true

rows:
  train_units: all
  score_units: null
  train_slots: all
  score_slots: all
  off_target_weight: 1.0

loss:
  gathering:
    file: ../data/gathering_points.json
  mode: group_mean
  gamma: 0.5
  fit_weight: 0.0

features:
  blocks: [calendar, geometry, trend, profile, weather]
  options:
    calendar:
      makeup_dow: 4
      holiday_dow: 5
      window_origin: train
    trend:
      clip: [0.3, 3.0]
      min_days_per_class: 4
    profile:
      fallback: zero
    weather:
      path: ../data/weather_hourly.csv
      heavy_mm: 2.0
      cold_c: 2.0
      hot_c: 26.0

fold:
  # Same geometry as the shipped config, so a smoke run exercises the folds a
  # real run would use.
  scheme: week_forward
  n_blocks: 4

model:
  params:
    objective: count:poisson
    tree_method: hist
    n_estimators: 200
    learning_rate: 0.08
    max_depth: 6
    min_child_weight: 4.0
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
    reg_alpha: 0.0
    gamma: 1e-8
    random_state: 0
    n_jobs: 1
    verbosity: 0
  tune:
    enabled: false
  calibrate: true
  calibration:
    compound: false

save:
  models: true
  dir: models
  predictions: true
