# =============================================================================
# LEGACY REPRODUCTION -- do not use this as a starting point.
#
# This config exists for one reason: to prove that the refactor did not change
# what the model computes.  It pins the two settings the refactor changed on
# purpose, so anyone can recover the original pipeline's behaviour.
#
# It differs from configs/horizon_am.yaml in four ways, all deliberate:
#
#   window_origin: frame   The window offset was counted from each split's own
#                          first day, so the booster learned day_of_window
#                          0..62 and was then asked about 0..20.  Counting from
#                          the training origin is both more defensible and
#                          slightly better, and it is what makes a saved model
#                          deterministic -- with 'frame' the same block-hour gets
#                          a different feature value depending on which other
#                          rows happen to be in the frame you predict.
#
#   compound: true         The level correction fed its own output forward, so
#                          fold 3 multiplied by fold 2's factor again.  Keeping
#                          it is what makes these numbers match the old report;
#                          the default config refits from the raw prediction.
#
#   full-day hourly slots  The original model scored all 24 hours.  The current
#                          default scores the 07:30-10:30 morning horizon.
#
#   source.kind: panel     The original trained on a pre-aggregated panel rather
#                          than on raw orders.
#
# A NOTE ON WHAT THIS CONFIG CAN NO LONGER REPRODUCE
# --------------------------------------------------
# The old panel carried a column `n_cells_touched`.  It was defined as the number
# of distinct cells inside a unit that saw any trip that day, i.e. it is computed
# from the same trips as the label.  At unit shape (1, 1) it evaluates to exactly
# `(arrivals + departures) > 0` at day level: the model was told, for every row of
# a day, whether that day had any activity at all.
#
# That column is gone from the pipeline, and the feature block that consumed it
# (`panel_context`) has been removed here too, so the numbers below will NOT be
# the 1.2167 / 1.1924 in the report.  Reproducing a leak is not reproducibility.
# The figures this config now yields are the honest version of the same
# architecture, and they are what tests/test_golden.py asserts.
# =============================================================================

run:
  name: compat_cell_l8_published
  outdir: ../../runs
  seed: 0
  verbose: true

source:
  kind: panel
  path: ../../data/panel_cell_l8.csv.gz
  slot_column: hour
  sort_rows: false

slots:
  start: 0
  span_minutes: 1440
  width_minutes: 60

unit:
  level: 8
  shape: [1, 1]
  aligned: true

rows:
  train_units: all
  score_units: null
  train_slots: all
  score_slots: all
  off_target_weight: 1.0

loss:
  gathering: none
  mode: group_mean
  gamma: 0.5
  fit_weight: 0.0

features:
  blocks:
    - calendar
    - geometry
    - trend
    - profile
    - weather
  options:
    calendar:
      makeup_dow: 4
      holiday_dow: 5
      window_origin: frame        # <- legacy
    trend:
      clip: [0.3, 3.0]
      min_days_per_class: 4
    profile:
      fallback: zero
    weather:
      path: ../../data/weather_hourly.csv
      heavy_mm: 2.0
      cold_c: 2.0
      hot_c: 26.0

fold:
  # Equal count, on purpose, and here it happens to be week-aligned too: this
  # panel is 84 consecutive days starting Monday 2026-03-02, so 84/4 = 21 days
  # put every edge on a Monday.  The published numbers came from this geometry.
  # `week_forward` would find the same edges on this panel; the setting is spelled
  # out so the two configs do not look like they disagree by accident.
  scheme: walk_forward
  n_blocks: 4

model:
  params:
    objective: count:poisson
    tree_method: hist
    n_estimators: 800
    learning_rate: 0.027961076605773953
    max_depth: 7
    min_child_weight: 15.148583299107765
    subsample: 0.6054044571993191
    colsample_bytree: 0.7263459249659886
    reg_lambda: 0.0025410102036745904
    reg_alpha: 2.999550383170158
    gamma: 1.8088467979761595e-07
    random_state: 0
    # n_jobs is a modelling choice, not a machine setting: XGBoost's histogram
    # build is not bit-reproducible across thread counts, and the effect is not
    # small.  Measured on this panel (arrivals, pooled raw deviance):
    #
    #   n_jobs   1        2        4        8        -1 (32 cores)
    #   dev      1.2133   1.2255   1.2315   1.2201   1.2159
    #
    # That is a 0.018 spread -- wider than most of the differences reported here.
    # A config left on -1 produces different numbers on a 4-core laptop and a
    # 32-core workstation, and nothing in the output would say so.
    #
    # THE PUBLISHED FIGURES WERE PRODUCED AT n_jobs = -1 ON A 32-CORE MACHINE.
    # That thread count is part of how they came out and does not transfer: at 1
    # this config yields 1.2140 raw / 1.1918 calibrated rather than 1.2167 /
    # 1.1924.  This file pins the model choices that matter (window_origin frame,
    # compound true) so the configuration is archived exactly, and pins threads to
    # 1 so anyone who runs it gets the same answer -- which is worth more than
    # matching the report in the third decimal on one particular CPU.
    n_jobs: 1
    verbosity: 0
  params_by_target:
    departures:
      n_estimators: 600
      learning_rate: 0.01930874625521765
      max_depth: 7
      min_child_weight: 15.697947891340355
      subsample: 0.6406684384106833
      colsample_bytree: 0.9760863470977748
      reg_lambda: 5.731413803716141
      reg_alpha: 0.026381692540113647
      gamma: 0.14180883120470236
  tune:
    enabled: false
    trials: 20
  calibrate: true
  calibration:
    compound: true                # <- legacy

save:
  models: false
  predictions: false
